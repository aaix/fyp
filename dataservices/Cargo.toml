[package]
name = "dataservices"
version = "0.1.0"
edition = "2024"

[dependencies]
scylla = "1.4.0"
tokio = { version = "1.40", features=["rt-multi-thread"]}
tonic = { version = "0.14.2", features = ["server"] }
tonic-prost = "0.14.2"
prost = "0.14.1"
uuid = { version = "1.18.1", features=["v1"] }
mac_address = "1.1.8"

futures = "0.3.32"

tonic-tracing-opentelemetry = "0.32.1"
init-tracing-opentelemetry = { version = "0.36.0", features = ["otlp", "tracing_subscriber_ext"]}
tracing = "0.1.44"

[build-dependencies]
tonic-prost-build = "*"