
networks:
  shared-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/16


x-scylla-base: &scylla-base
  image: az-database:latest
  depends_on:
    - scylla-seed
  stop_grace_period: 60s


services:

  jaeger:
    networks:
      - shared-network
    image: jaegertracing/all-in-one
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 16686:16686


  dataservices-0:
    networks:
      - shared-network
    image: az-dataservices:latest
    environment:
      - SCYLLA_URI=172.31.0.7
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://172.31.0.754:4317
    depends_on:
      scylla-seed:
        condition: service_healthy
      
  
  api-0:
    networks:
      - shared-network
    image: az-api:latest
    environment:
        DATASERVICES_URI: "dataservices-0:3114"
        OTEL_URI: "http://jaeger:4317"
        SECRET_KEY_API_SESSION_SIGN: ${SECRET_KEY_API_SESSION_SIGN}
        SECRET_KEY_API_SESSION_ENCRYPT: ${SECRET_KEY_API_SESSION_ENCRYPT}
    depends_on:
      - dataservices-0
    ports:
      - 8000:8000
    deploy:
      resources:
        # container has been crashing the host so its memory is limited
        limits:
          memory: 1024M
          cpus: '2'
  
  gateway-0:
    networks:
      - shared-network
    image: az-gateway:latest
    environment:
      - DATASERVICES_URI=dataservices-0:3114
    depends_on:
      - dataservices-0
    ports:
      - 8001:80


  scylla-seed:
    networks:
      shared-network:
        ipv4_address: 172.31.0.7
      
    image: az-database:latest
    volumes:
      - type: bind
        source: ./database/data/scylla0/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    hostname: scylla-seed

  scylla-node1:
    <<: *scylla-base
    volumes:
      - type: bind
        source: ./database/data/scylla1/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      shared-network:
          ipv4_address: 172.31.0.3

  scylla-node2:
    <<: *scylla-base
    volumes:
      - type: bind
        source: ./database/data/scylla2/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      shared-network:
          ipv4_address: 172.31.0.4

  scylla-node3:
    <<: *scylla-base
    volumes:
      - type: bind
        source: ./database/data/scylla3/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      shared-network:
          ipv4_address: 172.31.0.5

  scylla-node4:
    <<: *scylla-base
    volumes:
      - type: bind
        source: ./database/data/scylla4/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      shared-network:
          ipv4_address: 172.31.0.6