
networks:
  scylla-network:
    driver: bridge

services:
  scylla-seed:
    networks:
      - scylla-network
    image: az-scylla:latest
    volumes:
      - type: bind
        source: ./database/data/scylla0/
        target: /var/lib/scylla
    hostname: scylla-seed

  scylla-node1:
    networks:
      - scylla-network
    image: az-scylla:latest
    volumes:
      - type: bind
        source: ./database/data/scylla1/
        target: /var/lib/scylla
    depends_on:
      - scylla-seed
    command: ["--seeds", "scylla-seed"]
  
  scylla-node2:
    networks:
      - scylla-network
    image: az-scylla:latest
    volumes:
      - type: bind
        source: ./database/data/scylla2/
        target: /var/lib/scylla
    depends_on:
      - scylla-seed
    command: ["--seeds", "scylla-seed"]
