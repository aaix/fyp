
networks:
  shared-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/16


x-scylla-base: &scylla-base
  image: az-database:latest
  depends_on:
    - scylla-seed
  stop_grace_period: 60s
  environment:
    SEED: "scylla-seed"


services:

  jaeger:
    networks:
      - shared-network
    image: jaegertracing/all-in-one
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 16686:16686
    
  
  discoverystore-0:
    networks:
      - shared-network
    image: az-discoverystore:latest
  
  gc-0:
    networks:
      - shared-network
    image: az-garbagecollector:latest
    environment:
      BUCKETS: 0-0
      OTEL_URI: "http://jaeger:4317"
      VALKEY_URI: discoverystore-0:6379

      S3_PUBLIC_BUCKET: az7-dev-public
      S3_PRIVATE_BUCKET: az7-dev-private
      S3_ENDPOINT_URL: https://f2254f3b9e16dcc38a23d6ffc5db10a8.r2.cloudflarestorage.com
      S3_ACCESS_KEY_ID: ${SECRET_S3_ACCESS_KEY_ID}
      S3_ACCESS_KEY_SECRET: ${SECRET_S3_ACCESS_KEY_SECRET}
    depends_on:
      dataservices:
        condition: service_started
      discoverystore-0:
        condition: service_healthy

  watchdog:
    networks:
      - shared-network
    image: az-watchdog:latest
    environment:
      OTEL_URI: "http://jaeger:4317"
      VALKEY_URI: discoverystore-0:6379

    depends_on:
      discoverystore-0:
        condition: service_healthy

  dataservices:
    deploy:
      mode: replicated
      replicas: ${DATASERVICES_REPLICAS:-1}

    networks:
      - shared-network
    image: az-dataservices:latest
    environment:
      SCYLLA_URI: 172.31.0.199
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4317
      VALKEY_URI: redis://discoverystore-0:6379

    depends_on:
      scylla-seed:
        condition: service_healthy
      discoverystore-0:
        condition: service_healthy
      
  mediaservices-0:
    networks:
      - shared-network
    image: az-mediaservices:latest
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4317

      # dev bucket endpoint
      S3_PUBLIC_BUCKET: az7-dev-public
      S3_PRIVATE_BUCKET: az7-dev-private
      S3_ENDPOINT_URL: https://f2254f3b9e16dcc38a23d6ffc5db10a8.r2.cloudflarestorage.com
      S3_ACCESS_KEY_ID: ${SECRET_S3_ACCESS_KEY_ID}
      S3_ACCESS_KEY_SECRET: ${SECRET_S3_ACCESS_KEY_SECRET}
    deploy:
      resources:
        limits:
          memory: 2G


  api-0:
    networks:
      - shared-network
    image: az-api:latest
    environment:
      OTEL_URI: "http://jaeger:4317"
      API_SESSION_SIGNING_KEY: ${SECRET_KEY_API_SESSION_SIGN}
      API_SESSION_ENCRYPTION_KEY: ${SECRET_KEY_API_SESSION_ENCRYPT}
      VALKEY_URI: discoverystore-0:6379
      MEDIASERVICES_URI: mediaservices-0:3119

      S3_PUBLIC_BUCKET: az7-dev-public
      S3_PRIVATE_BUCKET: az7-dev-private
      S3_ENDPOINT_URL: https://f2254f3b9e16dcc38a23d6ffc5db10a8.r2.cloudflarestorage.com
      S3_ACCESS_KEY_ID: ${SECRET_S3_ACCESS_KEY_ID}
      S3_ACCESS_KEY_SECRET: ${SECRET_S3_ACCESS_KEY_SECRET}

    depends_on:
      discoverystore-0:
        condition: service_healthy
      dataservices:
        condition: service_started
    ports:
      - 8000:8000
  
  gateway:
    deploy:
      mode: replicated
      replicas: ${GATEWAY_REPLICAS:-1}
    networks:
      - shared-network
    image: az-gateway:latest
    environment:
        OTEL_URI: "http://jaeger:4317"
        VALKEY_URI: discoverystore-0:6379

    depends_on:
      discoverystore-0:
        condition: service_healthy
      dataservices:
        condition: service_started


  scylla-seed:
    networks:
      shared-network:
        ipv4_address: 172.31.0.199
      
    image: az-database:latest
    volumes:
      - type: bind
        source: ./database/data/scylla0/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    hostname: scylla-seed
    environment:
      SEED: "172.31.0.199"

  scylla-node1:
    <<: *scylla-base
    volumes:
      - type: bind
        source: ./database/data/scylla1/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      shared-network:
          ipv4_address: 172.31.0.203

  scylla-node2:
    <<: *scylla-base
    profiles:
      - full-cluster
    volumes:
      - type: bind
        source: ./database/data/scylla2/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      shared-network:
          ipv4_address: 172.31.0.202

  scylla-node3:
    <<: *scylla-base
    profiles:
      - full-cluster
    volumes:
      - type: bind
        source: ./database/data/scylla3/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      shared-network:
          ipv4_address: 172.31.0.201

  scylla-node4:
    <<: *scylla-base
    profiles:
      - full-cluster
    volumes:
      - type: bind
        source: ./database/data/scylla4/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      shared-network:
          ipv4_address: 172.31.0.200