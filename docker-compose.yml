
networks:
  scylla-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/16


x-scylla-base: &scylla-base
  image: az-scylla:latest
  depends_on:
    - scylla-seed


services:
  scylla-seed:
    networks:
      scylla-network:
        ipv4_address: 172.31.0.2
      
    image: az-scylla:latest
    volumes:
      - type: bind
        source: ./database/data/scylla0/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    hostname: scylla-seed

  scylla-node1:
    <<: *scylla-base
    volumes:
      - type: bind
        source: ./database/data/scylla1/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      scylla-network:
          ipv4_address: 172.31.0.3

  scylla-node2:
    <<: *scylla-base
    volumes:
      - type: bind
        source: ./database/data/scylla2/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      scylla-network:
          ipv4_address: 172.31.0.4

  scylla-node3:
    <<: *scylla-base
    volumes:
      - type: bind
        source: ./database/data/scylla3/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      scylla-network:
          ipv4_address: 172.31.0.5

  scylla-node4:
    <<: *scylla-base
    volumes:
      - type: bind
        source: ./database/data/scylla4/
        target: /var/lib/scylla
      - type: bind
        source: ./database/main.yaml
        target: /etc/scylla/scylla.yaml
    networks:
      scylla-network:
          ipv4_address: 172.31.0.6