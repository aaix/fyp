# partially generated by AI

name: Build and Push to GCP Artifact Registry

on:
  push:
    branches: [ "main" ]

# Required for BuildKit type=gha cache (manual docker buildx does not get this from the default token alone).
permissions:
  contents: read
  actions: write

env:
  PROJECT_ID: fyp-25coc251
  REGION: europe-west2
  REPOSITORY: az7-backend
  # Must match REGION/PROJECT_ID/REPOSITORY — api/gateway push shared here for buildx to pull BASE_IMAGE.
  SHARED_BASE_IMAGE: europe-west2-docker.pkg.dev/fyp-25coc251/az7-backend/shared-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [dataservices, database, api, gateway, discoverystore, mediaservices, garbagecollector]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_UI_DEPLOY_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Expose ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN so docker buildx --cache-to type=gha works from shell scripts.
      # See https://docs.docker.com/build/cache/backends/gha/
      - name: Expose GitHub Actions cache for buildx
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Run Build Script
        run: |
          # Make script executable just in case
          chmod +x ./${{ matrix.service }}/dockerbuild.sh
          
          # Execute the script with the commit hash as the argument
          ./${{ matrix.service }}/dockerbuild.sh ${{ github.sha }}

      - name: Tag and Push to Artifact Registry
        run: |
          # Construct the full image path
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}"
          

          docker tag az-${{ matrix.service }}:${{ github.sha }} $IMAGE_PATH:${{ github.sha }}
          docker tag az-${{ matrix.service }}:${{ github.sha }} $IMAGE_PATH:latest
          
          docker push $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:latest