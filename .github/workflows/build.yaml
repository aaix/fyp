# partially generated by AI

name: Build and Push to GCP Artifact Registry

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: fyp-25coc251
  REGION: europe-west2
  REPOSITORY: az7-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # api/gateway push shared here so buildx (docker-container) can pull BASE_IMAGE; enables GHA cache (unsupported on docker driver).
      SHARED_BASE_IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/shared-base
    strategy:
      matrix:
        service: [dataservices, database, api, gateway, discoverystore, mediaservices]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_UI_DEPLOY_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Run Build Script
        run: |
          # Make script executable just in case
          chmod +x ./${{ matrix.service }}/dockerbuild.sh
          
          # Execute the script with the commit hash as the argument
          ./${{ matrix.service }}/dockerbuild.sh ${{ github.sha }}

      - name: Tag and Push to Artifact Registry
        run: |
          # Construct the full image path
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}"
          

          docker tag az-${{ matrix.service }}:${{ github.sha }} $IMAGE_PATH:${{ github.sha }}
          docker tag az-${{ matrix.service }}:${{ github.sha }} $IMAGE_PATH:latest
          
          docker push $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:latest