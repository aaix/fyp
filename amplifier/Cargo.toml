[package]
name = "amplifier"
version = "0.1.0"
edition = "2024"

[dependencies]

bigpicture = {path = "../shared/rs/bigpicture"}

tokio = { version = "1.40", features=["rt-multi-thread", "signal"]}
tonic = { version = "0.14.2", features = ["server", "gzip"] }
tonic-prost = "0.14.2"
prost = "0.14.1"
prost-types="0.14.1"
local-ip-address = "0.6.10"
futures = "0.3.32"




tonic-tracing-opentelemetry = "0.32.1"
init-tracing-opentelemetry = { version = "0.36.0", features = ["otlp", "tracing_subscriber_ext"]}
tracing = "0.1.44"

[build-dependencies]
tonic-prost-build = "*"